# dsh-game-workshop 0.1.0 — DSH 0.2.2-rc.1 optional MCP entries.
# No installation, process launch, network connection, or profile change until
# the operator explicitly installs this patch and enables an individual entry.
# Replace absolute placeholders FIRST; never substitute a same-named third-party server.
# Official sources and safety/identity checks: ../docs/editors.md
- insert:
    - id: game-workshop-unity
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: true
      config:
        serverName: gw_unity
        transport: stdio
        # Official Unity CLI binary, NOT Unity.app's Editor executable.
        command: /REPLACE/WITH/official-unity-cli/bin/unity
        args:
          - mcp
          - --project-path
          - /REPLACE/WITH/UnityProject
          # Adds the official read-only unity-status tool for project discovery.
          - --cli-tools
        cwd: /REPLACE/WITH/UnityProject
        # Official privacy controls; Unity's persistent analytics preference is
        # separate. Review and opt out manually before enabling; see the guide.
        env:
          UNITY_NO_CLI_INVOKED_TELEMETRY: '1'
          UNITY_NO_CRASH_REPORT: '1'
          UNITY_NO_UPDATE_CHECK: '1'
        toolCallTimeoutMs: 60000
        failOnStartupError: false
        reconnect:
          enabled: false

    - id: game-workshop-unreal
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: true
      config:
        serverName: gw_unreal
        transport: streamable-http
        # UE 5.8 official Unreal MCP; local only, no authentication by default.
        url: http://127.0.0.1:8000/mcp
        toolCallTimeoutMs: 60000
        failOnStartupError: false
        reconnect:
          enabled: false

    - id: game-workshop-blender
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: true
      config:
        serverName: gw_blender
        transport: stdio
        # Install ONLY from https://projects.blender.org/lab/blender_mcp.
        # The official executable is also called blender-mcp; its name alone
        # does not prove provenance. Use an audited virtualenv's absolute path.
        command: /REPLACE/WITH/official-blender-lab-venv/bin/blender-mcp
        args: ['--transport', 'stdio']
        toolCallTimeoutMs: 60000
        failOnStartupError: false
        reconnect:
          enabled: false
